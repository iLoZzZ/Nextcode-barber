<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <title>NextCode | Reservas</title>
    </style>
</head>

<body>
    <nav class="navbar navbar-dark navbar-expand-lg barra-barber">
        <div class="container-fluid px-0">
            <a class="navbar-brand logo" href="index.html">NextCodeBarber</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir navegacion">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav menu me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="Servicios.html">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" href="Barberos.html">Empleados</a></li>
                    <li class="nav-item"><a class="nav-link active" href="Reservas.html" aria-current="page">Reservas</a></li>
                    <li class="nav-item"><a class="nav-link" href="Contacto.html">Contacto</a></li>
                </ul>

                <form class="d-flex buscador my-3 my-lg-0" role="search">
                    <div class="input-group">
                        <input class="form-control" type="search" placeholder="Search" aria-label="Buscar">
                        <button class="btn btn-search" type="submit">Search</button>
                    </div>
                </form>

                <div class="usuarios ms-lg-3 mt-2 mt-lg-0 d-flex gap-2">

                    <div class="dropdown">
                        <button class="btn btn-outline-light dropdown-toggle" type="button" id="dropdownSignup"
                            data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                            Sign-up
                        </button>
                        <form class="dropdown-menu dropdown-menu-end p-4 shadow" style="width: 280px;"
                            aria-labelledby="dropdownSignup">
                            <h5 class="mb-3">Registro</h5>
                            <div class="mb-3">
                                <label for="signupEmail" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="signupEmail" placeholder="tu@email.com">
                            </div>
                            <div class="mb-3">
                                <label for="signupPassword" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="signupPassword"
                                    placeholder="Contraseña">
                            </div>
                            <button type="submit" class="btn btn-dark w-100">Registrarse</button>
                        </form>
                    </div>

                    <div class="dropdown" id="loginDropdownWrap">
                        <button class="btn btn-primary dropdown-toggle" type="button" id="dropdownLogin"
                            data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                            Login
                        </button>
                        <form class="dropdown-menu dropdown-menu-end p-4 shadow" style="width: 280px;"
                            aria-labelledby="dropdownLogin" id="formLogin" novalidate>
                            <h5 class="mb-3">Iniciar Sesión</h5>
                            <div class="alert alert-danger py-2 small d-none" role="alert" id="loginError"></div>
                            <div class="mb-3">
                                <label for="loginUser" class="form-label">Usuario o correo electrónico</label>
                                <input type="text" class="form-control" id="loginUser"
                                    placeholder="usuario o tu@email.com" autocomplete="username">
                            </div>
                            <div class="mb-3">
                                <label for="loginPassword" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="loginPassword"
                                    placeholder="Contraseña" autocomplete="current-password">
                            </div>
                            <button type="submit" class="btn btn-dark w-100">Entrar</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="section-custom p-4 p-md-5 shadow-sm">
                    <h2 class="fw-bold title-serif text-center mb-4">Reserva tu Cita</h2>

                    <form id="formReserva">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre Completo</label>
                            <input type="text" class="form-control" placeholder="Tu nombre" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Teléfono / WhatsApp</label>
                            <input type="tel" class="form-control" placeholder="Ej: 300 123 4567" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Servicio</label>
                            <select class="form-select" required>
                                <option value="" selected disabled>Selecciona un servicio</option>
                                <option value="1">Corte clásico - $20.000</option>
                                <option value="2">Degradado - $25.000</option>
                                <option value="3">Corte + barba - $30.000</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Barbero</label>
                            <select class="form-select">
                                <option value="" selected>Cualquier barbero disponible</option>
                                <option value="1">David Torres</option>
                                <option value="2">Mateo Ramírez</option>
                                <option value="3">Santiago Ríos</option>
                            </select>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Fecha</label>
                                <input type="date" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Hora</label>
                                <select class="form-select" required>
                                    <option value="" selected disabled>Hora</option>
                                    <option value="10:00">10:00 AM</option>
                                    <option value="11:00">11:00 AM</option>
                                    <option value="14:00">02:00 PM</option>
                                    <option value="15:30">03:30 PM</option>
                                    <option value="17:00">05:00 PM</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-reserve btn-lg w-100 fw-bold">Confirmar Cita</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
    <script src="auth.js"></script>
</body>

</html>
